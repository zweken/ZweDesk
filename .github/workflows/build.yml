name: build

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (lite — no embedded WebView2 Runtime)
        shell: pwsh
        run: .\build.ps1 -NoEmbeddedRuntime -NoSdkInstall

      - name: Self-test (every remote script must parse)
        shell: pwsh
        run: |
          # ZweDesk.exe is a GUI-subsystem executable: the shell does not wait for it unless asked to
          $p = Start-Process -FilePath .\dist\ZweDesk.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\ZweDesk\selftest.txt"
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: ZweDesk-lite
          path: dist/ZweDesk.exe
