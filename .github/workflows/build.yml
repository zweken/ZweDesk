name: build

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (lite — no embedded WebView2 Runtime)
        shell: pwsh
        run: .\build.ps1 -NoEmbeddedRuntime -NoSdkInstall

      - name: Self-test (every remote script must parse)
        shell: pwsh
        run: |
          .\dist\ZweDesk.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "self-test failed" }
          Get-Content "$env:LOCALAPPDATA\ZweDesk\selftest.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ZweDesk-lite
          path: dist/ZweDesk.exe
